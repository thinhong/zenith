<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0f14" />
    <meta name="description" content="A small collection of quiet web apps for looking at life from outside it." />
    <title>Zenith</title>
    <link rel="icon" href="data:," />
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; background: #0b0f14; color: #d7dde5; font-family: system-ui, sans-serif; }
      main {
        box-sizing: border-box;
        min-height: 100vh; min-height: 100svh;
        display: flex; flex-direction: column; justify-content: center;
        max-width: 1160px; margin: 0 auto;
        padding: 48px 16px calc(64px + env(safe-area-inset-bottom, 0px));
      }
      h1 {
        margin: 0 0 36px;
        font-size: 12px; font-weight: 400;
        /* The indent balances the space the last letter carries after it. */
        letter-spacing: 0.38em; text-indent: 0.38em;
        text-transform: uppercase; text-align: center;
        color: #8b949e;
      }
      /* One column on a phone, two side by side on a wide screen, centred. */
      #apps {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 520px));
        justify-content: center;
        gap: 44px 28px;
      }
      .app { display: flex; flex-direction: column; color: inherit; text-decoration: none; }
      .app img {
        display: block;
        width: 100%; height: auto;
        aspect-ratio: 16 / 10; object-fit: cover;
        border-radius: 12px;
        background: #121821;
        /* A touch dim at rest, full on hover. Only a touch, because a phone
           has no hover and sees the resting state. */
        filter: brightness(0.92);
        transition: filter 0.8s ease;
      }
      .app:hover img, .app:focus-visible img { filter: none; }
      .app:focus-visible { outline: none; }
      .app:focus-visible img { outline: 2px solid #f0efe6; outline-offset: 4px; }
      .name { margin-top: 14px; font-size: 17px; color: #f0efe6; }
      .line { margin-top: 4px; font-size: 14px; line-height: 1.45; color: #9aa3ad; }
      @media (prefers-reduced-motion: reduce) { .app img { transition: none; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Zenith</h1>
      <nav id="apps" aria-label="Apps"></nav>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
