<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0b0f14" />
    <title>Zenith</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #0b0f14; color: #d7dde5; font-family: system-ui, sans-serif; overflow: hidden; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #hud { position: fixed; left: 12px; top: 12px; font-size: 12px; line-height: 1.5; opacity: 0.7; pointer-events: none; white-space: pre; }
      #hud.hidden { display: none; }
      /* Thoughts are DOM, so the text stays one readable size at any altitude. */
      #thoughts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
      .thought {
        position: absolute;
        left: 0; top: 0;
        padding: 4px 10px;
        border-radius: 12px;
        background: rgba(10, 14, 20, 0.62);
        color: #e7eaef;
        font-size: 13px;
        line-height: 1.32;
        text-align: center;
        /* Wraps rather than running off the frame. A long thought used to be
           cut in half by the edge of the screen. */
        max-width: min(250px, 42vw);
        will-change: transform, opacity;
      }
      /* The tail points down at the head the thought belongs to, and leans
         over when the pill has been slid in off the edge of the frame. */
      .thought::after {
        content: '';
        position: absolute;
        left: var(--tail, 50%);
        top: 100%;
        margin-left: -4px;
        border: 4px solid transparent;
        border-top-color: rgba(10, 14, 20, 0.62);
      }
      /* A thread back down to the person when the pill has been lifted clear
         of a neighbour, so the pair still reads as one thing. */
      .thought::before {
        content: '';
        position: absolute;
        left: var(--tail, 50%);
        top: 100%;
        width: 1px;
        height: var(--stem, 0px);
        margin-left: -0.5px;
        background: linear-gradient(rgba(215, 221, 229, 0.42), rgba(215, 221, 229, 0));
      }
      /* The bar keeps out of the way: no score, no badges, and it fades. */
      #bar {
        position: fixed; left: 0; right: 0; bottom: 0;
        display: flex; align-items: flex-end; justify-content: center;
        flex-wrap: wrap-reverse; gap: 8px;
        padding: 0 10px calc(10px + env(safe-area-inset-bottom, 0px));
        transition: opacity 0.6s ease;
      }
      #bar.away { opacity: 0; pointer-events: none; }
      .dial {
        display: flex; gap: 2px;
        padding: 4px;
        border-radius: 13px;
        background: rgba(10, 14, 20, 0.55);
      }
      .stop {
        display: flex; flex-direction: column; align-items: center; gap: 1px;
        min-width: 58px; min-height: 40px;
        padding: 4px 8px;
        border: 0; border-radius: 10px;
        background: transparent;
        color: #9aa3ad;
        font: inherit; font-size: 11px; line-height: 1.2;
        cursor: pointer;
      }
      .stop .name { font-size: 10px; opacity: 0.62; }
      .stop:hover:not(.unbuilt) { color: #dfe4ea; background: rgba(255, 255, 255, 0.06); }
      .stop.here { color: #f0efe6; background: rgba(255, 255, 255, 0.11); }
      .stop.unbuilt { opacity: 0.3; cursor: default; }
      .clock { align-items: center; gap: 8px; padding: 4px 10px; height: 40px; box-sizing: border-box; }
      .icon {
        width: 26px; height: 26px;
        border: 0; border-radius: 13px;
        background: transparent;
        color: #9aa3ad;
        font: inherit; font-size: 12px; line-height: 1;
        cursor: pointer;
      }
      .icon:hover, .icon.here { color: #f0efe6; background: rgba(255, 255, 255, 0.11); }
      .hours {
        -webkit-appearance: none; appearance: none;
        width: 132px; height: 3px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.22);
        cursor: pointer;
      }
      .hours::-webkit-slider-thumb {
        -webkit-appearance: none; appearance: none;
        width: 13px; height: 13px;
        border: 0; border-radius: 7px;
        background: #f0efe6;
        cursor: pointer;
      }
      .hours::-moz-range-thumb {
        width: 13px; height: 13px;
        border: 0; border-radius: 7px;
        background: #f0efe6;
        cursor: pointer;
      }
      .readout {
        min-width: 38px;
        color: #cfd6de;
        font-size: 11px; font-variant-numeric: tabular-nums;
      }
      #help {
        width: 34px; height: 34px;
        border: 0; border-radius: 17px;
        background: rgba(10, 14, 20, 0.55);
        color: #9aa3ad;
        font: inherit; font-size: 14px;
        cursor: pointer;
      }
      #help:hover { color: #dfe4ea; }
      #helpsheet {
        position: fixed; right: 12px; bottom: 62px;
        padding: 10px 13px;
        border-radius: 11px;
        background: rgba(10, 14, 20, 0.74);
        color: #d7dde5;
        font-size: 12px; line-height: 1.7;
      }
      #helpsheet.hidden { display: none; }

      /*
       * Touch targets. Keyed on the pointer, not on the width: a phone held
       * sideways is 844 px across and still has a finger on it, and a width
       * rule misses that entirely. The slider is the case that matters, since
       * its track is three pixels tall and a finger cannot land on that; the
       * padding grows the hit area without moving the line.
       */
      @media (pointer: coarse) {
        .icon { width: 40px; height: 40px; border-radius: 20px; }
        .hours { height: 40px; padding: 18px 0; background-clip: content-box; }
        .hours::-webkit-slider-thumb { width: 18px; height: 18px; }
        .hours::-moz-range-thumb { width: 18px; height: 18px; }
        .clock { height: 48px; }
        #help { width: 44px; height: 44px; border-radius: 22px; }
        .stop { min-height: 44px; }
      }

      /*
       * A narrow screen. The bar is five era stops, a slider and two buttons,
       * which is about five hundred pixels laid out in a line and will not fit
       * across a 375 px phone. It wraps instead.
       */
      @media (max-width: 640px) {
        #bar { gap: 6px; }
        .stop { min-width: 44px; padding: 4px 5px; font-size: 10px; }
        .stop .name { font-size: 9px; }
        .clock { padding: 4px 8px; gap: 6px; }
        .hours { width: 96px; }
        #hud { font-size: 10px; }
        #helpsheet { right: 10px; bottom: 120px; font-size: 11px; }
      }
      @media (max-width: 400px) {
        .stop { min-width: 38px; }
        .hours { width: 78px; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud" class="hidden"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
