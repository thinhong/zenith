<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0b0f14" />
    <title>Zenith</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #0b0f14; color: #d7dde5; font-family: system-ui, sans-serif; overflow: hidden; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #hud { position: fixed; left: 12px; top: 12px; font-size: 12px; line-height: 1.5; opacity: 0.7; pointer-events: none; white-space: pre; }
      #hud.hidden { display: none; }
      /* Thoughts are DOM, so the text stays one readable size at any altitude. */
      #thoughts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
      .thought {
        position: absolute;
        left: 0; top: 0;
        padding: 3px 9px;
        border-radius: 11px;
        background: rgba(10, 14, 20, 0.62);
        color: #e7eaef;
        font-size: 13px;
        line-height: 1.3;
        white-space: nowrap;
        will-change: transform, opacity;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud" class="hidden"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
