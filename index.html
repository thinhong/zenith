<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0b0f14" />
    <title>Zenith</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #0b0f14; color: #d7dde5; font-family: system-ui, sans-serif; overflow: hidden; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #hud { position: fixed; left: 12px; top: 12px; font-size: 12px; line-height: 1.5; opacity: 0.7; pointer-events: none; white-space: pre; }
      #hud.hidden { display: none; }
      /* Thoughts are DOM, so the text stays one readable size at any altitude. */
      #thoughts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
      .thought {
        position: absolute;
        left: 0; top: 0;
        padding: 3px 9px;
        border-radius: 11px;
        background: rgba(10, 14, 20, 0.62);
        color: #e7eaef;
        font-size: 13px;
        line-height: 1.3;
        white-space: nowrap;
        will-change: transform, opacity;
      }
      /* The bar keeps out of the way: no score, no badges, and it fades. */
      #bar {
        position: fixed; left: 0; right: 0; bottom: 0;
        display: flex; align-items: flex-end; justify-content: center; gap: 10px;
        padding: 0 12px calc(12px + env(safe-area-inset-bottom, 0px));
        transition: opacity 0.6s ease;
      }
      #bar.away { opacity: 0; pointer-events: none; }
      .dial {
        display: flex; gap: 2px;
        padding: 4px;
        border-radius: 13px;
        background: rgba(10, 14, 20, 0.55);
      }
      .stop {
        display: flex; flex-direction: column; align-items: center; gap: 1px;
        min-width: 58px; min-height: 40px;
        padding: 4px 8px;
        border: 0; border-radius: 10px;
        background: transparent;
        color: #9aa3ad;
        font: inherit; font-size: 11px; line-height: 1.2;
        cursor: pointer;
      }
      .stop .name { font-size: 10px; opacity: 0.62; }
      .stop:hover:not(.unbuilt) { color: #dfe4ea; background: rgba(255, 255, 255, 0.06); }
      .stop.here { color: #f0efe6; background: rgba(255, 255, 255, 0.11); }
      .stop.unbuilt { opacity: 0.3; cursor: default; }
      .clock { align-items: center; gap: 8px; padding: 4px 10px; height: 40px; box-sizing: border-box; }
      .icon {
        width: 26px; height: 26px;
        border: 0; border-radius: 13px;
        background: transparent;
        color: #9aa3ad;
        font: inherit; font-size: 12px; line-height: 1;
        cursor: pointer;
      }
      .icon:hover, .icon.here { color: #f0efe6; background: rgba(255, 255, 255, 0.11); }
      .hours {
        -webkit-appearance: none; appearance: none;
        width: 132px; height: 3px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.22);
        cursor: pointer;
      }
      .hours::-webkit-slider-thumb {
        -webkit-appearance: none; appearance: none;
        width: 13px; height: 13px;
        border: 0; border-radius: 7px;
        background: #f0efe6;
        cursor: pointer;
      }
      .hours::-moz-range-thumb {
        width: 13px; height: 13px;
        border: 0; border-radius: 7px;
        background: #f0efe6;
        cursor: pointer;
      }
      .readout {
        min-width: 38px;
        color: #cfd6de;
        font-size: 11px; font-variant-numeric: tabular-nums;
      }
      #closeall {
        width: 34px; height: 34px;
        border: 0; border-radius: 17px;
        background: rgba(10, 14, 20, 0.55);
        color: #9aa3ad;
        font: inherit; font-size: 13px; font-weight: 600;
        cursor: pointer;
      }
      #closeall:hover { color: #dfe4ea; }
      #closeall.here { color: #0d1218; background: #d9dee4; }
      #help {
        width: 34px; height: 34px;
        border: 0; border-radius: 17px;
        background: rgba(10, 14, 20, 0.55);
        color: #9aa3ad;
        font: inherit; font-size: 14px;
        cursor: pointer;
      }
      #help:hover { color: #dfe4ea; }
      #helpsheet {
        position: fixed; right: 12px; bottom: 62px;
        padding: 10px 13px;
        border-radius: 11px;
        background: rgba(10, 14, 20, 0.74);
        color: #d7dde5;
        font-size: 12px; line-height: 1.7;
      }
      #helpsheet.hidden { display: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud" class="hidden"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
